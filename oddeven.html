<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="num1">enter the value of number  :</label>
    <br><br>
    <input type="text" id="int"><br><br>
    <button onclick="oddeven()"> Enter Here to Submit your Data</button><br><br>
    <br>
    <h1 id="output"></h1>
    <script>

        function oddeven(){
             let num =Number(document.getElementById("int").value)
            if(num % 2 == 0){
               let res= document.getElementById("output")
               res.innerHTML = `${num} is even number !!`
            }
            else
            {
               let res= document.getElementById("output")
               res.innerHTML = `${num} is odd number !!`
            }
        }
    </script>
</body>
</html>
